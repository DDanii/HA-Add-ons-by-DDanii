configuration:
  APP_URL:
    name: App URL
    description: Public base URL used by the application so generated links can point to the right address.
  JWT_SIGNING_SECRET:
    name: JWT Signing Secret
    description: Secret value used to sign and validate JSON Web Tokens for the application.
  FLARESOLVER:
    name: Flaresolverr URL
    description: URL of the FlareSolverr service used by the application.
  TIMEOUT:
    name: Timeout
    description: Flaresolverr timeout in seconds.
  THEME:
    name: Theme
    description: Visual theme used by the application.
